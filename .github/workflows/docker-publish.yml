name: Build and publish Docker image

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and (if possible) push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Ensure GHCR package is public
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          OWNER_TYPE: ${{ github.event.repository.owner.type }}
          PACKAGE: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail

          if [ "${OWNER_TYPE}" = "Organization" ]; then
            metadata_endpoint="https://api.github.com/orgs/${OWNER}/packages/container/${PACKAGE}"
            visibility_endpoint="${metadata_endpoint}/visibility"
          else
            metadata_endpoint="https://api.github.com/users/${OWNER}/packages/container/${PACKAGE}"
            visibility_endpoint="https://api.github.com/user/packages/container/${PACKAGE}/visibility"
          fi

          metadata_file="$(mktemp)"
          metadata_status="$(curl -sS -o "${metadata_file}" -w "%{http_code}" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${metadata_endpoint}")"

          if [ "${metadata_status}" != "200" ]; then
            echo "Failed to read package metadata from ${metadata_endpoint} (HTTP ${metadata_status})"
            cat "${metadata_file}"
            exit 1
          fi

          visibility="$(jq -r '.visibility // empty' "${metadata_file}")"

          if [ -z "${visibility}" ]; then
            echo "Package visibility not found in API response from ${metadata_endpoint}"
            cat "${metadata_file}"
            exit 1
          fi

          if [ "${visibility}" != "public" ]; then
            update_file="$(mktemp)"
            update_status="$(curl -sS -o "${update_file}" -w "%{http_code}" -X PATCH \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${visibility_endpoint}" \
              -d '{"visibility":"public"}')"

            if [ "${update_status}" != "200" ] && [ "${update_status}" != "204" ]; then
              echo "Failed to set package visibility via ${visibility_endpoint} (HTTP ${update_status})"
              cat "${update_file}"
              exit 1
            fi
          fi

      - name: Verify GHCR pull works
        if: github.event_name != 'pull_request'
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          MAX_ATTEMPTS=3
          RETRY_DELAY_SECONDS=10

          docker logout "${{ env.REGISTRY }}" || true

          for ((attempt=1; attempt<=MAX_ATTEMPTS; attempt++)); do
            echo "Anonymous GHCR pull attempt ${attempt}/${MAX_ATTEMPTS}"
            if docker pull "${IMAGE_REF}"; then
              exit 0
            fi
            if [ "${attempt}" -lt "${MAX_ATTEMPTS}" ]; then
              sleep "${RETRY_DELAY_SECONDS}"
            fi
          done

          echo "Failed to pull ${IMAGE_REF} after retries"
          exit 1
